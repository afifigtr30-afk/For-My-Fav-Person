<link rel="stylesheet" href="styles.css">
<style>
  /* Bentuk Love licin tanpa border/frame putih, saiz dibesarkan lagi jadi 220px supaya lebih puas hati & ngam */
  .heart-shape {
    width: 270px;
    height: 270px;
    position: relative;
    overflow: hidden;
    background: #f0f0f0;
    box-shadow: 0 14px 35px rgba(0,0,0,0.2);
    clip-path: url(#heartClip);
    -webkit-clip-path: url(#heartClip);
  }
  .heart-shape img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
</style>
</head>
<body>

<!-- SVG ClipPath untuk bentuk Love yang sempurna & licin -->
<svg width="0" height="0" style="position: absolute; pointer-events: none;">
  <defs>
    <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
      <path d="M .5, .88 C .2, .62 .02, .42 .02, .25 C .02, .11 .13, .02 .27, .02 C .38, .02 .47, .1 .5, .2 C .53, .1 .62, .02 .73, .02 C .87, .02 .98, .11 .98, .25 C .98, .42 .8, .62 .5, .88 Z"/>
    </clipPath>
  </defs>
</svg>

      <div class="env-flap"></div>
